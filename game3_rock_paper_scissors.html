<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>가위바위보 게임</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .btn { font-size: 30px; margin: 10px; padding: 15px 25px; cursor: pointer; border-radius: 10px; border: 1px solid #ccc; background: white; }
        .result { font-size: 20px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>✂️ ✊ 🖐️ 가위바위보 게임</h2>
    <div>
        <button class="btn" onclick="play('가위')">✂️ 가위</button>
        <button class="btn" onclick="play('바위')">✊ 바위</button>
        <button class="btn" onclick="play('보')">🖐️ 보</button>
    </div>
    <div class="result" id="result">선택해주세요!</div>

    <script>
        function play(userChoice) {
            const choices = ['가위', '바위', '보'];
            const compChoice = choices[Math.floor(Math.random() * 3)];
            let res = "";

            if (userChoice === compChoice) {
                res = "비겼습니다!";
            } else if (
                (userChoice === '가위' && compChoice === '보') ||
                (userChoice === '바위' && compChoice === '가위') ||
                (userChoice === '보' && compChoice === '바위')
            ) {
                res = "🎉 당신이 이겼습니다!";
            } else {
                res = "💻 컴퓨터가 이겼습니다!";
            }

            document.getElementById('result').innerHTML = `
                나: ${userChoice} vs 컴퓨터: ${compChoice}<br><br>${res}
            `;
        }
    </script>
</body>
</html>
