<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>마법 스펠 디펜스 (Magic Spell Defense)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e15;
            font-family: 'Pretendard', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: radial-gradient(circle at center, #1a1c2e 0%, #0d0e15 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            display: block;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
        }
        .stats-panel {
            background: rgba(15, 20, 35, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .stat-label {
            font-size: 12px;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .hp-bar-container {
            width: 250px;
            height: 22px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 11px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
            margin-top: 5px;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 12px rgba(255, 75, 43, 0.8);
        }
        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }
        .spell-bar {
            display: flex;
            gap: 12px;
            pointer-events: auto;
            margin-bottom: 20px;
            align-self: center;
            background: rgba(15, 20, 35, 0.75);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .spell-slot {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .spell-slot.active {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            background: rgba(0, 240, 255, 0.15);
        }
        .spell-slot .key-bind {
            position: absolute;
            top: 3px;
            left: 6px;
            font-size: 10px;
            color: #aaa;
            font-weight: bold;
        }
        .spell-slot .icon {
            font-size: 24px;
        }
        .spell-slot .cd-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            transition: height 0.1s linear;
        }
        /* Overlay Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 20, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 100;
        }
        .title {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(45deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            text-align: center;
        }
        .subtitle {
            font-size: 16px;
            color: #a0aec0;
            margin-bottom: 30px;
        }
        .btn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #6200ea, #b388ff);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(98, 0, 234, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 25px rgba(98, 0, 234, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .instructions {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 450px;
            line-height: 1.6;
            font-size: 14px;
            color: #cbd5e0;
        }
        .hidden {
            display: none !important;
        }
        /* Upgrade Modal */
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            max-width: 800px;
            width: 90%;
        }
        .upgrade-card {
            background: rgba(20, 25, 45, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .upgrade-card:hover {
            border-color: #00f0ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.3);
        }
        .upgrade-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
        .upgrade-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }
        .upgrade-desc {
            font-size: 13px;
            color: #a0aec0;
            text-align: center;
            margin-bottom: 15px;
        }
        .upgrade-cost {
            font-size: 15px;
            font-weight: bold;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
        <div class="hud-top">
            <div class="stats-panel">
                <div class="stat-item">
                    <span class="stat-label">체력</span>
                    <div class="hp-bar-container">
                        <div id="hpFill" class="hp-bar-fill"></div>
                        <div id="hpText" class="hp-text">100 / 100</div>
                    </div>
                </div>
                <div class="stat-item">
                    <span class="stat-label">웨이브</span>
                    <span id="waveVal" class="stat-value">1</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">골드</span>
                    <span id="goldVal" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">점수</span>
                    <span id="scoreVal" class="stat-value">0</span>
                </div>
            </div>
        </div>

        <div class="spell-bar">
            <div class="spell-slot active" id="slot-1" onclick="selectSpell(0)">
                <span class="key-bind">1</span>
                <span class="icon">🔥</span>
                <div class="cd-overlay" id="cd-1"></div>
            </div>
            <div class="spell-slot" id="slot-2" onclick="selectSpell(1)">
                <span class="key-bind">2</span>
                <span class="icon">❄️</span>
                <div class="cd-overlay" id="cd-2"></div>
            </div>
            <div class="spell-slot" id="slot-3" onclick="selectSpell(2)">
                <span class="key-bind">3</span>
                <span class="icon">⚡</span>
                <div class="cd-overlay" id="cd-3"></div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay-screen">
        <h1 class="title">마법 스펠 디펜스</h1>
        <p class="subtitle">Magic Spell Defense</p>
        <button class="btn" onclick="startGame()">게임 시작</button>

        <div class="instructions">
            <p><strong>[조작법]</strong></p>
            <p><strong>WASD / 방향키</strong> : 이동</p>
            <p><strong>마우스 클릭</strong> : 마법 발사</p>
            <p><strong>숫자키 1, 2, 3</strong> : 마법 스펠 변경</p>
            <br>
            <p>몬스터 침략으로부터 마법탑을 지키고 강화하세요!</p>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="overlay-screen hidden">
        <h1 class="title" style="background: linear-gradient(45deg, #ff416c, #ff4b2b); -webkit-background-clip: text;">GAME OVER</h1>
        <p class="subtitle" id="finalScore">최종 점수: 0</p>
        <button class="btn" onclick="restartGame()">다시 도전</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Canvas Resize
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Audio Synthesizer (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioCtx();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'fireball') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(80, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'ice') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'lightning') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.setValueAtTime(600, now + 0.05);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'hit') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }

    // State Variables
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let gold = 0;
    let wave = 1;
    let waveTimer = 0;
    let enemiesToSpawn = 0;
    let spawnInterval = 0;

    // Player
    const player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 20,
        speed: 4,
        hp: 100,
        maxHp: 100,
        currentSpell: 0,
        angle: 0
    };

    // Key status
    const keys = {};

    // Mouse status
    const mouse = { x: 0, y: 0, isDown: false };

    // Spells
    const spells = [
        { name: '화염구', color: '#ff4b2b', speed: 8, cd: 200, damage: 25, radius: 8, type: 'fire' },
        { name: '얼음송곳', color: '#00f0ff', speed: 10, cd: 350, damage: 18, radius: 6, type: 'ice' },
        { name: '번개', color: '#ffe600', speed: 14, cd: 500, damage: 45, radius: 5, type: 'lightning' }
    ];
    let lastCastTime = [0, 0, 0];

    // Arrays
    let projectiles = [];
    let enemies = [];
    let particles = [];

    // Keyboard Listeners
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'Digit1') selectSpell(0);
        if (e.code === 'Digit2') selectSpell(1);
        if (e.code === 'Digit3') selectSpell(2);
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    window.addEventListener('mousedown', (e) => {
        if (gameState === 'PLAYING') {
            mouse.isDown = true;
            castSpell();
        }
    });

    window.addEventListener('mouseup', () => {
        mouse.isDown = false;
    });

    function selectSpell(index) {
        player.currentSpell = index;
        document.querySelectorAll('.spell-slot').forEach((slot, i) => {
            if (i === index) slot.classList.add('active');
            else slot.classList.remove('active');
        });
    }

    function startGame() {
        initAudio();
        gameState = 'PLAYING';
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('gameOverScreen').classList.add('hidden');
        
        // Reset Stats
        player.hp = 100;
        player.maxHp = 100;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        score = 0;
        gold = 0;
        wave = 1;
        
        projectiles = [];
        enemies = [];
        particles = [];
        
        updateUI();
        startWave();
        requestAnimationFrame(gameLoop);
    }

    function restartGame() {
        startGame();
    }

    function startWave() {
        enemiesToSpawn = 5 + wave * 3;
        spawnInterval = setInterval(() => {
            if (enemiesToSpawn > 0 && gameState === 'PLAYING') {
                spawnEnemy();
                enemiesToSpawn--;
            } else {
                clearInterval(spawnInterval);
            }
        }, Math.max(400, 1500 - wave * 80));
    }

    function spawnEnemy() {
        // Spawn from canvas edges
        let x, y;
        if (Math.random() < 0.5) {
            x = Math.random() < 0.5 ? -30 : canvas.width + 30;
            y = Math.random() * canvas.height;
        } else {
            x = Math.random() * canvas.width;
            y = Math.random() < 0.5 ? -30 : canvas.height + 30;
        }

        const hp = 30 + wave * 15;
        const speed = 1.2 + Math.random() * 0.8 + (wave * 0.05);
        enemies.push({
            x, y,
            radius: 16,
            hp: hp,
            maxHp: hp,
            speed: speed,
            color: '#a855f7',
            slowTimer: 0
        });
    }

    function castSpell() {
        const now = Date.now();
        const spell = spells[player.currentSpell];
        
        if (now - lastCastTime[player.currentSpell] < spell.cd) return;
        lastCastTime[player.currentSpell] = now;

        playSound(spell.type === 'fire' ? 'fireball' : spell.type === 'ice' ? 'ice' : 'lightning');

        const dx = mouse.x - player.x;
        const dy = mouse.y - player.y;
        const dist = Math.hypot(dx, dy);

        projectiles.push({
            x: player.x,
            y: player.y,
            vx: (dx / dist) * spell.speed,
            vy: (dy / dist) * spell.speed,
            radius: spell.radius,
            color: spell.color,
            damage: spell.damage,
            type: spell.type
        });
    }

    function createParticles(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                radius: Math.random() * 3 + 1,
                color,
                alpha: 1,
                life: 0.03 + Math.random() * 0.03
            });
        }
    }

    function updateUI() {
        document.getElementById('hpFill').style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
        document.getElementById('hpText').textContent = `${Math.max(0, Math.round(player.hp))} / ${player.maxHp}`;
        document.getElementById('scoreVal').textContent = score;
        document.getElementById('goldVal').textContent = gold;
        document.getElementById('waveVal').textContent = wave;
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // Player Movement
        if (keys['KeyW'] || keys['ArrowUp']) player.y -= player.speed;
        if (keys['KeyS'] || keys['ArrowDown']) player.y += player.speed;
        if (keys['KeyA'] || keys['ArrowLeft']) player.x -= player.speed;
        if (keys['KeyD'] || keys['ArrowRight']) player.x += player.speed;

        // Boundaries
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

        // Player Angle
        player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

        // Continuous Fire if Mouse Held
        if (mouse.isDown) castSpell();

        // Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            const p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;

            // Offscreen
            if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                projectiles.splice(i, 1);
                continue;
            }

            // Hit Enemies
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                const dist = Math.hypot(p.x - e.x, p.y - e.y);
                if (dist < p.radius + e.radius) {
                    e.hp -= p.damage;
                    playSound('hit');
                    createParticles(p.x, p.y, p.color, 10);

                    if (p.type === 'ice') {
                        e.slowTimer = 60; // Slow enemy
                    }

                    projectiles.splice(i, 1);

                    if (e.hp <= 0) {
                        createParticles(e.x, e.y, '#a855f7', 20);
                        enemies.splice(j, 1);
                        score += 100;
                        gold += 15;
                        updateUI();
                    }
                    break;
                }
            }
        }

        // Enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            
            let currentSpeed = e.speed;
            if (e.slowTimer > 0) {
                currentSpeed *= 0.5;
                e.slowTimer--;
            }

            const dx = player.x - e.x;
            const dy = player.y - e.y;
            const dist = Math.hypot(dx, dy);

            e.x += (dx / dist) * currentSpeed;
            e.y += (dy / dist) * currentSpeed;

            // Attack Player
            if (dist < player.radius + e.radius) {
                player.hp -= 0.5;
                updateUI();
                createParticles(player.x, player.y, '#ff416c', 2);

                if (player.hp <= 0) {
                    gameState = 'GAMEOVER';
                    document.getElementById('finalScore').textContent = `최종 점수: ${score}`;
                    document.getElementById('gameOverScreen').classList.remove('hidden');
                }
            }
        }

        // Check Wave Completion
        if (enemies.length === 0 && enemiesToSpawn <= 0) {
            wave++;
            updateUI();
            startWave();
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.life;
            if (p.alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);
        
        // Glow
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f0ff';
        
        // Body
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
        ctx.fill();

        // Staff/Direction line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(player.radius + 10, 0);
        ctx.stroke();

        ctx.restore();

        // Draw Projectiles
        projectiles.forEach(p => {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });

        // Draw Enemies
        enemies.forEach(e => {
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = e.slowTimer > 0 ? '#00f0ff' : '#a855f7';
            ctx.fillStyle = e.slowTimer > 0 ? '#00f0ff' : e.color;
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
            ctx.fill();

            // HP Bar
            const hpRatio = e.hp / e.maxHp;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(e.x - 15, e.y - e.radius - 8, 30, 4);
            ctx.fillStyle = '#ff4b2b';
            ctx.fillRect(e.x - 15, e.y - e.radius - 8, 30 * hpRatio, 4);

            ctx.restore();
        });

        // Draw Particles
        particles.forEach(p => {
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    function gameLoop() {
        if (gameState === 'PLAYING') {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
    }
</script>

</body>
</html>
