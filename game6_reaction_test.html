<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>반응 속도 테스트</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; user-select: none; }
        #box { width: 80%; height: 60%; background-color: #ce1212; color: white; display: flex; justify-content: center; align-items: center; font-size: 28px; border-radius: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>⚡ 반응 속도 테스트</h2>
    <div id="box">클릭하여 시작하세요</div>

    <script>
        const box = document.getElementById('box');
        let startTime, timeoutId;
        let state = 'waiting';

        box.addEventListener('click', () => {
            if (state === 'waiting') {
                state = 'ready';
                box.style.backgroundColor = '#ce1212';
                box.innerText = '초록색으로 바뀌면 클릭하세요!';
                const randomTime = Math.floor(Math.random() * 3000) + 2000;
                timeoutId = setTimeout(() => {
                    state = 'now';
                    box.style.backgroundColor = '#4E9F3D';
                    box.innerText = '지금 클릭하세요!';
                    startTime = Date.now();
                }, randomTime);
            } else if (state === 'ready') {
                clearTimeout(timeoutId);
                box.innerText = '너무 빨랐습니다! 다시 클릭하여 시작하세요.';
                state = 'waiting';
            } else if (state === 'now') {
                const reactionTime = Date.now() - startTime;
                box.style.backgroundColor = '#1F51FF';
                box.innerText = `반응 속도: ${reactionTime} ms! 다시 시작하려면 클릭하세요.`;
                state = 'waiting';
            }
        });
    </script>
</body>
</html>
