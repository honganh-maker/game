<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>숫자 맞추기 게임</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; max-width: 400px; margin: 0 auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { padding: 10px; font-size: 16px; margin: 5px; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎯 숫자 맞추기 게임</h2>
        <p>1부터 100 사이의 숫자를 맞춰보세요!</p>
        <input type="number" id="guess" min="1" max="100">
        <button onclick="checkGuess()">제출</button>
        <p id="message"></p>
        <p>시도 횟수: <span id="count">0</span></p>
    </div>
    <script>
        const target = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        function checkGuess() {
            const userGuess = parseInt(document.getElementById('guess').value);
            attempts++;
            document.getElementById('count').innerText = attempts;
            const msg = document.getElementById('message');
            if (userGuess === target) {
                msg.innerText = `🎉 정답입니다! (${attempts}번 만에 맞춤)`;
                msg.style.color = "green";
            } else if (userGuess < target) {
                msg.innerText = "UP! 더 큰 숫자입니다.";
                msg.style.color = "blue";
            } else {
                msg.innerText = "DOWN! 더 작은 숫자입니다.";
                msg.style.color = "red";
            }
        }
    </script>
</body>
</html>
