<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>틱택토 게임</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; justify-content: center; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background-color: white; border: 2px solid #333; font-size: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>❌ 틱택토 (Tic-Tac-Toe) ⭕</h2>
    <h3 id="status">현재 차례: X</h3>
    <div class="board" id="board"></div>
    <button onclick="resetGame()">다시 시작</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let active = true;

        function createBoard() {
            const boardElem = document.getElementById('board');
            boardElem.innerHTML = '';
            board.forEach((val, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.innerText = val;
                cell.onclick = () => handleClick(index);
                boardElem.appendChild(cell);
            });
        }

        function handleClick(index) {
            if (board[index] !== "" || !active) return;
            board[index] = currentPlayer;
            checkWinner();
            if (active) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                document.getElementById('status').innerText = `현재 차례: ${currentPlayer}`;
            }
            createBoard();
        }

        function checkWinner() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                const [a, b, c] = w;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById('status').innerText = `🎉 승리: ${board[a]}!`;
                    active = false;
                    return;
                }
            }
            if (!board.includes("")) {
                document.getElementById('status').innerText = "무승부입니다!";
                active = false;
            }
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            active = true;
            document.getElementById('status').innerText = "현재 차례: X";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
